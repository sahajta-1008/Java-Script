<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Data Structure and Array</title>
</head>

<body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
        var student = {
            name: 'Sahajta',
            age: '11',
            grade: '6',
            hobbies: 'Drawing',
            fav_sport: 'Basketball'
        };

        var color = ["white", "black", "red", "green", "blue"];
        
        document.write("Student name is : " + student.name,"<br>", "Student favorite sport is : " 
        + student.fav_sport);
        document.write("<br>")
        
        document.write("<br>Before Popping the colors are: " + color.join(", "));
        document.write("<br> My favorite color is : " + color[4]);

        color.pop();
        document.write("<br> After Popping the colors are : " + color.join(", "));
    </script>
</body>

</html>
