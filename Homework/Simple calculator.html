<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        #nums{
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Simple Calculator</h1>
    <h3>Perform all Operations using JavaScript</h3>
    <p id="nums"></p>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>

    <script>
        var num1 = 10;
        var num2 = 2;
        var add = num1 + num2;
        var sub = num1 - num2;
        var mul = num1 * num2;
        var div = num1 / num2;

        document.getElementById("nums").innerHTML =
            "The two numbers are " + num1 +" and " + num2 +

        document.getElementById("add").innerHTML 
            "The added value is: " + add;

        document.getElementById("sub").innerHTML =
            "The subtracted value is: " + sub;

        document.getElementById("mul").innerHTML =
            "The multiplied value is: " + mul;

        document.getElementById("div").innerHTML =
            "The divided value is: " + div;
    </script>
</body>

</html>
