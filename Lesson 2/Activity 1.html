<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="one(5)">Login</button>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        function one(a,b){
            if (b===undefined){
                b=5
            }
            document.getElementById("demo1").innerHTML=a*b
            document.getElementById("demo2").innerHTML=a
            document.getElementById("demo3").innerHTML=b
        }
    </script>
</body>
</html>
