<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let animal = ["Dog", "Cat", "Penguin", "Giraffe", "Lion", "Peacock"]
        for (let i = 0; i <= 5; i++) {
            document.write(animal[i])
            document.write("<br>")
        }

        let student = {
            name: "Sahajta",
            age: 11
        }
        document.write("My name is " + student.name)
        document.write("<br>")
        document.write("<br>")



        let answer = Math.pow(5, 12)
        document.write("5 raise to the power 12 is " + answer)
        document.write("<br>")
        document.write("<br>")



        let nums = [10, 28, 57, 65, 36, 1, 9, 55, 376, 765, 2854]
        let max = 0
        for (let i = 0; i <= 10; i++) {
            if (nums[i] > max) {
                max = nums[i]
            }
        }
        document.write("The greatest number from 10, 28, 57, 65, 36, 1, 9, 55, 376, 765, 2854 is " + max)
        document.write("<br>")
    </script>
</body>

</html>
